<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click the Box Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }

    h1 {
      margin-top: 20px;
    }

    #game-area {
      width: 100%;
      height: 80vh;
      position: relative;
      border: 2px solid #ccc;
      background: white;
      margin-top: 20px;
      overflow: hidden;
    }

    #box {
      width: 50px;
      height: 50px;
      background-color: #3498db;
      position: absolute;
      cursor: pointer;
      display: none;
    }

    #scoreboard {
      margin-top: 10px;
      font-size: 1.2em;
    }

    #start-btn {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Click the Box!</h1>
  <button id="start-btn">Start Game</button>
  <div id="scoreboard">Time: <span id="time">30</span> | Score: <span id="score">0</span></div>
  <div id="game-area">
    <div id="box"></div>
  </div>

  <script>
    const box = document.getElementById('box');
    const gameArea = document.getElementById('game-area');
    const startBtn = document.getElementById('start-btn');
    const timeDisplay = document.getElementById('time');
    const scoreDisplay = document.getElementById('score');

    let score = 0;
    let timeLeft = 30;
    let timer;
    let boxTimer;

    function randomPosition() {
      const maxX = gameArea.clientWidth - 50;
      const maxY = gameArea.clientHeight - 50;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      box.style.left = `${x}px`;
      box.style.top = `${y}px`;
    }

    function showBox() {
      randomPosition();
      box.style.display = 'block';
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeLeft;
      box.style.display = 'none';

      timer = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          clearInterval(boxTimer);
          box.style.display = 'none';
          alert('Game over! Your score is: ' + score);
        }
      }, 1000);

      boxTimer = setInterval(showBox, 800);
    }

    box.addEventListener('click', () => {
      score++;
      scoreDisplay.textContent = score;
      box.style.display = 'none';
    });

    startBtn.addEventListener('click', startGame);
  </script>

</body>
</html>
